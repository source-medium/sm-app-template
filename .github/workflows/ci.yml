# Checks only: no deployment, no secrets, no pull_request_target.
# Your host's git integration deploys; this workflow never does.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: many customers' agents run there, and symlinks or CRLF would break the template.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test details (only when pnpm check failed)
        if: failure()
        run: pnpm exec vitest run

  e2e:
    name: Sample-mode end-to-end tests (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    name: Builds, secret isolation, and Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next build with sentinel credentials, then scan everything a browser can receive.
      - run: pnpm test:secrets
      # The OpenNext build Cloudflare runs, then each configuration mode in workerd.
      - run: pnpm build:cloudflare
      - run: pnpm smoke:worker
