# Checks only: no deployment, no secrets, no pull_request_target.
# Your host's git integration deploys; this workflow never does.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The template itself also checks Windows, where symlinks or CRLF would break it for customers'
        # agents. A copy of the template checks Linux only; add windows-latest back if you develop there.
        os: ${{ github.repository == 'source-medium/sm-app-template' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test details (only when pnpm check failed)
        if: failure()
        run: pnpm exec vitest run

  build:
    name: Builds, secret isolation, and Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # One sanitized build for secret scans, Playwright + axe, and workerd.
      - run: pnpm test:secrets
      - run: pnpm test:browser
      - run: pnpm smoke:worker
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
